<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LOCAL GI ARENA · Artifact planner · 7.1</title>
<style>*{box-sizing:border-box}body{font:17px/1.55 system-ui;background:#eef3ef;color:#19372e;max-width:760px;margin:5vh auto;padding:1rem}main{background:white;border-radius:18px;padding:clamp(1rem,4vw,2.5rem)}header,section,label{display:flex;align-items:center;gap:1rem;justify-content:space-between;flex-wrap:wrap}label{margin:12px 0}select,button{font:inherit;border:1px solid #9aaea5;border-radius:7px;padding:.4em .7em}button{background:#245847;color:white;cursor:pointer}small{color:#526a60}hr{border:0;border-top:1px solid #cedbd2}</style>
<main><header><small>LOCAL GI ARENA / 7.1</small><button id="lang">中文</button></header><h1 id="title"></h1><p id="desc"></p><label><span id="loadLabel"></span><input type="file" id="load" accept=".json"></label><output id="msg" aria-live="polite"></output><hr><label><span id="setLabel"></span><select id="set"></select></label><label><span id="rarityLabel"></span><select id="rarity"></select></label><div id="slots"></div><button id="save"></button></main>
<script>
'use strict';
const $=s=>document.getElementById(s), keys=['EQUIP_BRACER','EQUIP_NECKLACE','EQUIP_SHOES','EQUIP_RING','EQUIP_DRESS'];
const dict=[['Artifact set planner','Offline worksheet. The built-in set is fictional. Nothing is added to a game account.','Open a local catalog','Set','Stars','Export five-piece plan','Flower','Plume','Sands','Goblet','Circlet','Invalid catalog or no complete sets','Example set','Stat A','Stat B'],['圣遗物套装规划器','离线规划。内置套装是虚构示例，不会向游戏账号添加装备。','打开本地词条目录','套装','星级','导出五件规划','生之花','死之羽','时之沙','空之杯','理之冠','目录格式错误或没有完整套装','示例套装','属性甲','属性乙']];
let l=0, demo=true,c={sets:[{id:1}],pieces:keys.map((slot,i)=>({slot,id:i+1,setId:1,stars:5,mains:[{id:10},{id:20}]}))}, groups=[];
function index(c){if(!Array.isArray(c.sets)||!Array.isArray(c.pieces))throw Error();const m=new Map();for(const p of c.pieces){if(!keys.includes(p.slot)||!Number.isInteger(p.id)||!Number.isInteger(p.stars)||!Array.isArray(p.mains)||!p.mains.length||!p.mains.every(x=>x&&Number.isInteger(x.id)))continue;const k=p.setId+':'+p.stars;if(!m.has(k))m.set(k,{id:p.setId,stars:p.stars,pieces:{}});const v=m.get(k).pieces;if(!v[p.slot]||(p.initial||0)>(v[p.slot].initial||0))v[p.slot]=p}return [...m.values()].filter(x=>keys.every(k=>x.pieces[k])&&c.sets.some(s=>s.id===x.id))}
function options(el,items,old){el.replaceChildren(...items.map(([id,t])=>new Option(t,id)));if(items.some(([id])=>String(id)===String(old)))el.value=old}
function render(){const t=dict[l],old=$('set').value;document.documentElement.lang=l?'zh-CN':'en';['title','desc','loadLabel','setLabel','rarityLabel','save'].forEach((k,i)=>$(k).textContent=t[i]);$('lang').textContent=l?'English':'中文';options($('set'),c.sets.filter(s=>groups.some(g=>g.id===s.id)).map(s=>[s.id,demo?t[12]:s.name||s.id]),old);rarity()}
function rarity(){const id=+$('set').value;options($('rarity'),groups.filter(g=>g.id===id).map(g=>[g.stars,g.stars+' ★']),$('rarity').value);slots()}
function group(){return groups.find(g=>g.id===+$('set').value&&g.stars===+$('rarity').value)}
function slots(){const old=keys.map(k=>$(k)?.value);$('slots').replaceChildren();keys.forEach((k,i)=>{const label=document.createElement('label'),s=document.createElement('select');s.id=k;label.append(dict[l][6+i],s);$('slots').append(label);options(s,group().pieces[k].mains.map((a,j)=>[a.id,demo?dict[l][13+j]:a.label||a.prop||a.id]),old[i])})}
$('set').onchange=rarity;$('rarity').onchange=slots;$('lang').onclick=()=>{l=1-l;render()};$('load').onchange=async e=>{try{const next=JSON.parse((await e.target.files[0].text()).replace(/^\uFEFF/,'')),g=index(next);if(!g.length)throw Error();c=next;groups=g;demo=false;$('msg').textContent=e.target.files[0].name;render()}catch{$('msg').textContent=dict[l][11]}};
$('save').onclick=()=>{const g=group(),data={format:'artifact-plan-v1',example:demo,setId:g.id,stars:g.stars,pieces:keys.map(k=>({slot:k,itemId:g.pieces[k].id,mainPropId:+$(k).value}))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='artifact-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
groups=index(c);render();
</script></html>
